workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Unzip project
        script: |
          unzip -o ruhul.zip || true
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Update Gradle Distribution and Build
        script: |
          PROP_FILE=$(find . -name "gradle-wrapper.properties" -type f | head -n 1)
          if [ -n "$PROP_FILE" ]; then
            ROOT_DIR=$(dirname $(dirname $(dirname "$PROP_FILE")))
            echo "Updating gradle wrapper in: $PROP_FILE"
            sed -i '' 's/gradle-.*-bin.zip/gradle-8.5.1-bin.zip/g' "$PROP_FILE"
            cd "$ROOT_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "gradle-wrapper.properties not found!"
            exit 1
          fi
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
      - "**/build/outputs/apk/**/*.apk"
