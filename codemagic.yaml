workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Unzip project
        script: |
          unzip -o ruhul.zip || true
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Update Gradle wrapper and Build
        script: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            BUILD_DIR=$(dirname "$GRADLEW_PATH")
            echo "Found gradlew in: $BUILD_DIR"
            cd "$BUILD_DIR"
            chmod +x gradlew
            ./gradlew wrapper --gradle-version 8.5.1
            ./gradlew assembleDebug
          else
            echo "gradlew not found!"
            exit 1
          fi
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
