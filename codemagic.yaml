workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Unzip project
        script: |
          unzip -o ruhul.zip || true
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build Root Project
        script: |
          BUILD_FILE=$(find . -name "build.gradle*" -type f | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            ROOT_DIR=$(dirname "$BUILD_FILE")
            echo "Navigating to Root Directory: $ROOT_DIR"
            cd "$ROOT_DIR"
            gradle wrapper --gradle-version 8.7 || true
            if [ -f "./gradlew" ]; then
              chmod +x gradlew
              ./gradlew assembleDebug
            else
              echo "Executing direct gradle build..."
              gradle assembleDebug
            fi
          else
            echo "build.gradle file not found!"
            exit 1
          fi
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
