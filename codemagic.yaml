workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Unzip project
        script: |
          unzip -o ruhul.zip || true
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Fix Wrapper and Build
        script: |
          PROP_FILE=$(find . -name "gradle-wrapper.properties" -type f | head -n 1)
          if [ -n "$PROP_FILE" ]; then
            WRAPPER_DIR=$(dirname "$PROP_FILE")
            ROOT_DIR=$(cd "$WRAPPER_DIR/../.." && pwd)
            echo "Project root found at: $ROOT_DIR"
            sed -i '' 's/gradle-.*-bin.zip/gradle-8.5.1-bin.zip/g' "$PROP_FILE"
            cd "$ROOT_DIR"
            if [ -f "./gradlew" ]; then
              chmod +x gradlew
              ./gradlew assembleDebug
            else
              echo "gradlew not found, using global gradle..."
              gradle assembleDebug
            fi
          else
            echo "gradle-wrapper.properties not found!"
            exit 1
          fi
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
