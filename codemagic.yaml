workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Unzip project
        script: |
          unzip -o ruhul.zip
          cp -rn ruhul/* . || true
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build Android APK
        script: |
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            cd ruhul && chmod +x gradlew && ./gradlew assembleDebug
          fi
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - ruhul/app/build/outputs/apk/**/*.apk
